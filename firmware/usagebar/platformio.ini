; SmallTV "usagebar": shows Claude / Codex / Antigravity usage pushed from a Mac
; (tools/push_usage.py -> POST /api/usage). Keeps safeboot's recovery guarantees:
; Wi-Fi + HTTP /update always up before the display, crash guard, stock FS untouched.

[env:smalltv]
platform = espressif8266
board = esp12e
framework = arduino
; 80MHz + SPI 40MHz: the combination visually verified on this panel (160MHz/80MHz init gave a black screen)
board_build.f_cpu = 80000000L

; Match the stock image header: 4MB flash, DIO mode (header bytes e9 02 02 40).
board_build.flash_mode = dio
board_upload.flash_size = 4MB
; 4M3M layout, same as stock: OTA staging stays inside the first 1MB.
board_build.ldscript = eagle.flash.4m3m.ld

extra_scripts = post:scripts/no_float_printf.py

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.2.0

build_flags =
    -DUSAGEBAR_VERSION=\"2.6.1\"
    ; TFT_eSPI config (pins confirmed by disassembling stock V3.1.4)
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=-1
    -DTFT_DC=0
    -DTFT_RST=2
    -DTFT_SPI_MODE=SPI_MODE3
    -DTFT_RGB_ORDER=TFT_RGB
    -DSPI_FREQUENCY=40000000
    ; lwIP without forwarding/NAPT features: this device is only a TCP client/server
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY_LOW_FLASH
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1

monitor_speed = 115200

; Release build for GitHub: ignores include/secrets.h, so no Wi-Fi password or token is compiled in.
; The device starts the "SmallTV-Setup" access point until Wi-Fi is set on its web page.
;   pio run -e release
[env:release]
extends = env:smalltv
build_flags =
    ${env:smalltv.build_flags}
    -DUSAGEBAR_RELEASE
