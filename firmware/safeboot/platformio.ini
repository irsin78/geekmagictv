; "safeboot": diagnostics/rescue firmware for the GeekMagic SmallTV (ESP8266 / ESP-12F, 4MB flash).
; Keeps Wi-Fi + OTA alive at all times, serves the full flash read-only (/flash.bin) and measures
; what the hardware can do (/diag). It never mounts the filesystem, so the stock LittleFS stays
; untouched.
;
;   pio run              your build (uses include/secrets.h), ~440 KB: fits an upload from stock
;   pio run -e release   no secrets compiled in: open "SmallTV-Safe" access point (192.168.4.1)

[env:smalltv]
platform = espressif8266
board = esp12e
framework = arduino
; 80 MHz CPU + 40 MHz SPI: the combination verified to initialise this panel.
board_build.f_cpu = 80000000L

; Match the stock image header: 4MB flash, DIO mode (header bytes e9 02 02 40).
board_build.flash_mode = dio
board_upload.flash_size = 4MB
; 4M3M layout: sketch + OTA staging stay inside the first 1MB,
; so an OTA from this firmware can never overwrite the stock FS region.
board_build.ldscript = eagle.flash.4m3m.ld

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bodmer/TJpg_Decoder@^1.1.0

build_flags =
    -DSAFEBOOT_VERSION=\"0.3.1\"
    ; TFT_eSPI config (pins confirmed by disassembling the stock firmware)
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=-1
    -DTFT_DC=0
    -DTFT_RST=2
    -DTFT_SPI_MODE=SPI_MODE3
    -DTFT_RGB_ORDER=TFT_RGB
    -DSPI_FREQUENCY=40000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1

monitor_speed = 115200

; Release build for GitHub: ignores include/secrets.h.
[env:release]
extends = env:smalltv
build_flags =
    ${env:smalltv.build_flags}
    -DSAFEBOOT_RELEASE
