; Stage 1 "safeboot" firmware for GeekMagic SmallTV (ESP8266 / ESP-12F, 4MB flash).
; Purpose: keep Wi-Fi + OTA alive at all times, dump the full flash read-only,
; and measure what the hardware can actually do (diagnostics at /diag).
; It never mounts the filesystem, so the stock LittleFS data stays untouched.

[env:smalltv]
platform = espressif8266
board = esp12e
framework = arduino
; 160MHz: runtime switching does nothing on this core, so it is a build option.
board_build.f_cpu = 160000000L

; Match the stock image header: 4MB flash, DIO mode (header bytes e9 02 02 40).
board_build.flash_mode = dio
board_upload.flash_size = 4MB
; 4M3M layout: sketch + OTA staging stay inside the first 1MB,
; so an OTA from this firmware can never overwrite the stock FS region.
board_build.ldscript = eagle.flash.4m3m.ld

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bodmer/TJpg_Decoder@^1.1.0

build_flags =
    -DSAFEBOOT_VERSION=\"0.3.0\"
    -DDIAG_TLS=1
    -DSAFEBOOT_LEAN=1  ; no mDNS/ArduinoOTA (HTTP /update stays) to fit BearSSL
    ; TFT_eSPI config (pins from ESPHome / community docs for ESP8266 SmallTV)
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=-1
    -DTFT_DC=0
    -DTFT_RST=2
    -DTFT_SPI_MODE=SPI_MODE3
    -DTFT_RGB_ORDER=TFT_RGB
    -DSPI_FREQUENCY=40000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1

monitor_speed = 115200
